  <!-- Structured data -->
  <script type="application/ld+json">

    "@graph": [

      },

        "@id": "https://md-store.sidecartridge.com/#webpage",
        "url": "https://md-store.sidecartridge.com/",
        "name": "SidecarTridge Microfirmware Store",
        "description": "The application store for SidecarTridge devices — browse and install microfirmwares for the SidecarTridge Multi-device family.",

      }

  <!-- Pure.css (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css"
    integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous" />
  <!-- Grid responsiveness (sm, md, lg classes) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css" />
  <link rel="stylesheet" href="styles.css?v=6.0" />

  <!-- Font Awesome for icons (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <!-- Catalog app (EPIC-02/03/04): loads platforms.json, aggregates each platform's
       official (in-repo, D-05) + unofficial (remote, HTTPS, C-04) catalogs with
       provenance, and drives the browse UI — platform landing, source switcher,
       search/filter, and app detail. Hash routing (#<platform>[/<source>]); untrusted
       description HTML is sanitized to a safe whitelist (C-03). init() runs on start. -->
  <script>
    function storeData() {
      return {
        navMenuOpen: false,
        loading: true,
        error: '',
        platforms: [],
        activePlatform: null,
        sources: [],   // [{ kind, id, label, apps_url, author, status, error, count }]
        apps: [],      // merged, provenance-tagged: { ...app, _source, _sourceKind, _author, _duplicate }
        unofficialRegistryError: '',
        // ----- view / UI state (EPIC-04) -----
        view: 'platforms',        // 'platforms' | 'catalog'
        activeSourceId: 'official',
        search: '',
        activeTag: '',
        activeDevice: '',
        detailApp: null,
        testMode: false,        // EPIC-06: ?data=test
        dataBase: '',           // '' (real) | 'test/' (fixtures)
        downloadable: false,    // ?downloadable — reveals .uf2 link + md5 in detail (D-13)

        async init() {
          window.addEventListener('hashchange', () => this.applyHash());
          const params = new URLSearchParams(location.search);
          this.testMode = params.get('data') === 'test';
          this.dataBase = this.testMode ? 'test/' : '';
          this.downloadable = params.has('downloadable');
          try {
            const res = await fetch(this.dataBase + 'platforms.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error('platforms.json → HTTP ' + res.status);
            const data = await res.json();
            this.platforms = (data.platforms || [])
              .filter(p => p && p.enabled)
              .sort((a, b) => (a.order || 0) - (b.order || 0));
          } catch (e) {
            this.error = e.message || String(e);
            this.loading = false;
            return;
          }
          await this.applyHash();   // honor an initial #platform[/source] deep link
          this.loading = false;
        },

        // ----- routing: #<platform-id>[/<source-id>] -----
        async applyHash() {
          const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
          const [pid, sid] = h.split('/');
          const p = pid && this.platforms.find(x => x.id === pid);
          if (!p) { this.view = 'platforms'; this.activePlatform = null; this.detailApp = null; return; }
          this.view = 'catalog';
          if (!this.activePlatform || this.activePlatform.id !== p.id) {
            this.loading = true;
            await this.loadPlatform(p);
            this.loading = false;
          }
          this.activeSourceId = (sid && this.sources.some(s => s.id === sid)) ? sid : 'official';
          this.search = ''; this.activeTag = ''; this.activeDevice = ''; this.detailApp = null;
        },
        selectPlatform(p) { location.hash = p.id; },
        backToPlatforms() { location.hash = ''; },
        selectSource(id) { location.hash = this.activePlatform.id + (id !== 'official' ? '/' + id : ''); },

        // ----- derived views (EPIC-04) -----
        activeSource() { return this.sources.find(s => s.id === this.activeSourceId) || null; },
        sourceApps() { return this.apps.filter(a => a._source === this.activeSourceId); },
        visibleApps() {
          const q = this.search.trim().toLowerCase();
          return this.sourceApps().filter(a => {
            if (q && !String(a.name || '').toLowerCase().includes(q)) return false;
            if (this.activeTag && !(a.tags || []).includes(this.activeTag)) return false;
            if (this.activeDevice && !(a.devices || []).includes(this.activeDevice)) return false;
            return true;
          });
        },
        tagsForSource() { const s = new Set(); this.sourceApps().forEach(a => (a.tags || []).forEach(t => s.add(t))); return [...s].sort(); },
        devicesForSource() { const s = new Set(); this.sourceApps().forEach(a => (a.devices || []).forEach(d => s.add(d))); return [...s].sort(); },
        clearFilters() { this.search = ''; this.activeTag = ''; this.activeDevice = ''; },
        openDetail(a) { this.detailApp = a; },
        closeDetail() { this.detailApp = null; },

        // ----- no-logo art (EPIC-05 STORY-02): placehold.co / missing / broken -> brand monogram
        noLogo(app) { const src = (app && app.image) || ''; return !src || /placehold\.co/i.test(src); },
        initials(name) {
          const clean = String(name || '').replace(/\(TEST\)/i, '').trim();
          const parts = clean.split(/\s+/).filter(Boolean);
          const s = parts.length >= 2 ? (parts[0][0] + parts[1][0]) : clean.slice(0, 2);
          return (s || '?').toUpperCase();
        },
        logoBg(name) {
          let h = 0; const s = String(name || '');
          for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
          return 'linear-gradient(135deg, hsl(' + h + ',42%,52%), hsl(' + ((h + 40) % 360) + ',42%,38%))';
        },

        // ----- sanitize untrusted description HTML (C-03) -----
        sanitize(html) {
          if (html == null) return '';
          const ALLOWED = { A: ['href'], B: [], I: [], EM: [], STRONG: [], BR: [], CODE: [], P: [], UL: [], OL: [], LI: [], SPAN: [] };
          const body = new DOMParser().parseFromString(String(html), 'text/html').body;
          const copy = (src, dest) => {
            src.childNodes.forEach(node => {
              if (node.nodeType === 3) {
                dest.appendChild(document.createTextNode(node.nodeValue));
              } else if (node.nodeType === 1) {
                const spec = ALLOWED[node.tagName];
                if (spec) {
                  const el = document.createElement(node.tagName);
                  spec.forEach(a => {
                    const v = node.getAttribute(a);
                    if (a === 'href' && v && /^https?:\/\//i.test(v)) el.setAttribute('href', v);
                  });
                  if (node.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
                  copy(node, el);
                  dest.appendChild(el);
                } else {
                  copy(node, dest); // drop the tag, keep its text/children
                }
              }
            });
          };
          const out = document.createElement('div');
          copy(body, out);
          return out.innerHTML;
        },

        // ----- data loading (EPIC-02/03) -----
        async loadPlatform(p) {
          this.activePlatform = p;
          this.sources = [];
          this.apps = [];
          this.unofficialRegistryError = '';
          const seen = new Set();   // uuid precedence: official is loaded first and wins
          const merged = [];
          const sources = [];       // built locally; assigned to this.sources once, at the end

          // 1) Official catalog — in-repo, same-origin (dataBase = 'test/' in test mode, D-11).
          const official = { kind: 'official', id: 'official', label: 'Official', apps_url: this.dataBase + p.apps_url, author: null, status: 'loading', error: '', count: 0 };
          sources.push(official);
          await this._loadSource(official, seen, merged);

          // 2) Unofficial catalogs — from the platform's in-repo unofficial.json registry.
          let defs = [];
          if (p.unofficial_url) {
            try {
              const res = await fetch(this.dataBase + p.unofficial_url, { cache: 'no-cache' });
              if (!res.ok) throw new Error('HTTP ' + res.status);
              const data = await res.json();
              defs = (data.sources || []).filter(s => s && s.enabled).map(s => ({
                kind: 'unofficial', id: s.id, label: s.name || s.id, apps_url: s.apps_url,
                author: s.author || null, status: 'loading', error: '', count: 0
              }));
            } catch (e) {
              this.unofficialRegistryError = e.message || String(e);
            }
          }
          defs.forEach(d => sources.push(d));
          // Fetch unofficial feeds in parallel; a failing feed is isolated per-source.
          await Promise.all(defs.map(d => this._loadSource(d, seen, merged)));

          // Assign once, after every source's status is final. Alpine re-renders on the
          // assignment; mutating already-pushed objects in place would not (that was the
          // "stuck on loading…" bug).
          this.sources = sources;
          this.apps = merged;
        },
        async _loadSource(src, seen, merged) {
          // Unofficial feeds are remote and must be HTTPS (C-04); official is same-origin/relative.
          if (src.kind === 'unofficial' && !/^https:\/\//i.test(src.apps_url || '')) {
            src.status = 'error';
            src.error = 'unofficial feed must be served over HTTPS (C-04)';
            return;
          }
          try {
            const res = await fetch(src.apps_url, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const list = Array.isArray(data.apps) ? data.apps : [];
            let n = 0;
            for (const app of list) {
              const dup = !!(app.uuid && seen.has(app.uuid));
              if (app.uuid) seen.add(app.uuid);
              merged.push(Object.assign({}, app, {
                _source: src.id, _sourceKind: src.kind, _author: src.author, _duplicate: dup
              }));
              n++;
            }
            src.count = n;
            src.status = 'loaded';
          } catch (e) {
            src.status = 'error';
            src.error = e.message || String(e);
          }
        }
      };
    }
  </script>
</head>

<body class="browser-page" x-data="storeData()">
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-header-copy">
        <span class="app-header-kicker"><a href="https://sidecartridge.com/" target="_blank" rel="noopener"
            style="color:inherit">SidecarTridge</a></span>
        <h1>Microfirmware Store</h1>
      </div>
      <button type="button" class="app-nav-toggle" aria-controls="primaryNav"
        :aria-expanded="navMenuOpen ? 'true' : 'false'" @click="navMenuOpen = !navMenuOpen">
        <i class="fas" :class="navMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
        <span x-text="navMenuOpen ? 'Close' : 'Menu'"></span>
      </button>
    </div>
  </header>

  <nav id="primaryNav" class="app-nav" :class="{'is-open': navMenuOpen}">
    <div class="app-nav-inner">
      <a href="#" class="app-nav-link is-active" aria-current="page">Store</a>
      <a href="https://docs.sidecartridge.com/" target="_blank" class="app-nav-link"
        @click="navMenuOpen = false">Docs</a>
      <a href="https://sidecartridge.com/" target="_blank" class="app-nav-link"
        @click="navMenuOpen = false">SidecarTridge</a>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content browser-main">

    <!-- test-data mode indicator (EPIC-06, D-11) -->
    <div class="test-banner" x-show="testMode" x-cloak>
      <i class="fas fa-flask"></i>
      <span>Test data mode (<code>?data=test</code>) — fictional platforms &amp; apps. <a href="./">Back to real data</a>.</span>
    </div>

    <!-- global loading -->
    <div class="browser-loading" x-show="loading">
      <div class="browser-loading-card">
        <i class="fas fa-spinner fa-spin"></i>
        <div><strong>Loading…</strong><p>Fetching the catalog.</p></div>
      </div>
    </div>

    <!-- platform registry failed -->
    <section class="browser-section" x-show="!loading && error" x-cloak>
      <div class="browser-empty-state">
        <i class="fas fa-triangle-exclamation"></i>
        <p>Couldn't load the platform registry: <span x-text="error"></span></p>
      </div>
    </section>

    <!-- ============ Platform landing (STORY-01) ============ -->
    <template x-if="!loading && !error && view === 'platforms'">
      <div>
        <section class="browser-hero" style="grid-template-columns: 1fr;">
          <div class="browser-hero-copy">
            <span class="browser-kicker">Microfirmware Store</span>
            <h2>The application store for your SidecarTridge devices.</h2>
            <p>
              Browse and install microfirmwares — the applications and services that run on the
              <a href="https://sidecartridge.com/" target="_blank" rel="noopener">SidecarTridge</a>
              device family. Pick a platform to explore its catalog.
            </p>
          </div>
        </section>

        <div class="browser-card-grid" x-show="platforms.length">
          <template x-for="p in platforms" :key="p.id">
            <article class="platform-card" role="button" tabindex="0"
              @click="selectPlatform(p)" @keydown.enter="selectPlatform(p)" @keydown.space.prevent="selectPlatform(p)">
              <span class="platform-logo" :style="'--logo-bg:' + logoBg(p.name)">
                <span class="platform-noimg" x-text="initials(p.name)"></span>
                <img class="platform-logo-img" :src="p.image" :alt="p.name + ' logo'" loading="lazy"
                  onerror="this.remove()">
              </span>
              <div class="platform-card-body">
                <h3 x-text="p.name"></h3>
                <p x-text="p.description"></p>
                <div class="platform-card-devices">
                  <template x-for="d in (p.devices || [])" :key="d"><span class="browser-entry-tag" x-text="d"></span></template>
                </div>
              </div>
              <span class="platform-card-go" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
            </article>
          </template>
        </div>
        <div class="browser-empty-state browser-empty-state-muted" x-show="!platforms.length">
          <i class="fas fa-circle-info"></i>
          <p>No platforms are available yet.</p>
        </div>
      </div>
    </template>

    <!-- ============ Catalog view (STORY-02 + STORY-03) ============ -->
    <template x-if="!loading && !error && view === 'catalog'">
      <div>
        <div class="catalog-head">
          <button type="button" class="pure-button" @click="backToPlatforms()"><i class="fas fa-arrow-left"></i> Platforms</button>
          <span class="catalog-head-logo" x-show="activePlatform" :style="'--logo-bg:' + logoBg(activePlatform ? activePlatform.name : '')">
            <span class="platform-noimg" x-text="activePlatform ? initials(activePlatform.name) : ''"></span>
            <img class="platform-logo-img" :src="activePlatform ? activePlatform.image : ''"
              :alt="activePlatform ? activePlatform.name + ' logo' : ''" onerror="this.remove()">
          </span>
          <div>
            <span class="browser-section-kicker">Platform</span>
            <h2 class="catalog-title" x-text="activePlatform ? activePlatform.name : ''"></h2>
          </div>
        </div>

        <!-- source switcher: Official (default) + unofficial -->
        <div class="source-switcher" role="tablist" aria-label="Catalog source">
          <template x-for="s in sources" :key="s.id">
            <button type="button" class="source-tab" role="tab"
              :class="{ 'is-active': activeSourceId === s.id, 'is-error': s.status === 'error' }"
              :aria-selected="activeSourceId === s.id ? 'true' : 'false'"
              @click="selectSource(s.id)">
              <span x-text="s.label"></span>
              <span class="source-tab-kind" x-text="s.kind"></span>
            </button>
          </template>
        </div>

        <!-- unofficial provenance notice (D-07) -->
        <div class="unofficial-notice" x-show="activeSource() && activeSource().kind === 'unofficial'" x-cloak>
          <i class="fas fa-triangle-exclamation"></i>
          <p>
            <strong>Unofficial source.</strong>
            <template x-if="activeSource() && activeSource().author">
              <span>By
                <template x-if="activeSource().author.url">
                  <a :href="activeSource().author.url" target="_blank" rel="noopener" x-text="activeSource().author.name || 'a third party'"></a>
                </template>
                <template x-if="!activeSource().author.url">
                  <span x-text="activeSource().author.name || 'a third party'"></span>
                </template>.
              </span>
            </template>
            Not reviewed or endorsed by SidecarTridge — use at your own risk.
          </p>
        </div>

        <!-- selected source failed to load -->
        <div class="browser-empty-state" x-show="activeSource() && activeSource().status === 'error'" x-cloak>
          <i class="fas fa-triangle-exclamation"></i>
          <p x-text="'This source failed to load: ' + (activeSource() ? activeSource().error : '')"></p>
        </div>

        <!-- search + filters -->
        <section class="browser-filter-panel" x-show="activeSource() && activeSource().status === 'loaded'" x-cloak>
          <div class="browser-search-row">
            <label class="browser-search-field">
              <i class="fas fa-magnifying-glass"></i>
              <input type="text" x-model="search" placeholder="Search microfirmwares…" aria-label="Search microfirmwares">
            </label>
            <button type="button" class="pure-button" x-show="search || activeTag || activeDevice" @click="clearFilters()">Clear</button>
          </div>
          <div class="browser-taxonomy" x-show="tagsForSource().length">
            <template x-for="t in tagsForSource()" :key="'t-' + t">
              <button type="button" class="taxonomy-chip" :class="{ active: activeTag === t }" @click="activeTag = (activeTag === t ? '' : t)"><span x-text="t"></span></button>
            </template>
          </div>
          <div class="browser-taxonomy" x-show="devicesForSource().length">
            <template x-for="d in devicesForSource()" :key="'d-' + d">
              <button type="button" class="taxonomy-chip" :class="{ active: activeDevice === d }" @click="activeDevice = (activeDevice === d ? '' : d)"><span x-text="d"></span></button>
            </template>
          </div>
          <p class="browser-summary" x-text="visibleApps().length + ' of ' + sourceApps().length + ' microfirmwares'"></p>
        </section>

        <!-- app grid -->
        <div class="browser-card-grid" x-show="activeSource() && activeSource().status === 'loaded'" x-cloak>
          <template x-for="app in visibleApps()" :key="app._source + '-' + app.uuid">
            <article class="app-card" role="button" tabindex="0" :aria-label="'View details for ' + app.name"
              @click="openDetail(app)" @keydown.enter="openDetail(app)" @keydown.space.prevent="openDetail(app)">
              <div class="app-card-media" :style="'--logo-bg:' + logoBg(app.name)">
                <span class="app-noimg" x-text="initials(app.name)"></span>
                <template x-if="!noLogo(app)">
                  <img class="app-card-img" :src="app.image" :alt="app.name" loading="lazy" onerror="this.remove()">
                </template>
              </div>
              <div class="app-card-body">
                <div class="browser-entry-topline">
                  <span class="browser-entry-tag" x-text="app.version"></span>
                  <span class="browser-entry-tag" x-show="app._duplicate" title="Also in the official catalog">also official</span>
                </div>
                <h4 x-text="app.name"></h4>
                <div class="app-card-tags">
                  <template x-for="t in (app.tags || [])" :key="t"><span class="browser-entry-tag" x-text="t"></span></template>
                </div>
                <p class="app-card-devices" x-show="(app.devices || []).length" x-text="(app.devices || []).join(' · ')"></p>
              </div>
              <span class="app-card-cta"><i class="fas fa-circle-info"></i> View details</span>
            </article>
          </template>
        </div>

        <!-- no results -->
        <div class="browser-empty-state" x-show="activeSource() && activeSource().status === 'loaded' && visibleApps().length === 0" x-cloak>
          <i class="fas fa-magnifying-glass"></i>
          <p>No microfirmwares match your filters.</p>
        </div>
      </div>
    </template>

    <!-- ============ App detail modal (STORY-03) ============ -->
    <div class="app-modal" x-show="detailApp" x-cloak style="display:none" @keydown.escape.window="closeDetail()">
      <div class="app-modal-overlay" @click="closeDetail()"></div>
      <div class="app-modal-content" role="dialog" aria-modal="true" :aria-label="detailApp ? detailApp.name : 'App details'">
        <button type="button" class="app-modal-close" @click="closeDetail()" aria-label="Close"><i class="fas fa-xmark"></i></button>
        <template x-if="detailApp">
          <div>
            <div class="app-modal-media" :style="'--logo-bg:' + logoBg(detailApp.name)">
              <span class="app-noimg" x-text="initials(detailApp.name)"></span>
              <template x-if="!noLogo(detailApp)">
                <img class="app-card-img" :src="detailApp.image" :alt="detailApp.name" onerror="this.remove()">
              </template>
            </div>
            <div class="browser-entry-topline">
              <span class="browser-entry-tag" x-text="detailApp.version"></span>
              <template x-for="t in (detailApp.tags || [])" :key="t"><span class="browser-entry-tag" x-text="t"></span></template>
            </div>
            <h3 x-text="detailApp.name"></h3>
            <!-- description is untrusted third-party HTML → sanitized to a whitelist (C-03) -->
            <div class="app-detail-desc" x-html="sanitize(detailApp.description)"></div>
            <p class="browser-entry-path" x-show="(detailApp.devices || []).length">Devices: <span x-text="(detailApp.devices || []).join(', ')"></span></p>
            <!-- Default: no download, no md5 (install is device-only, D-10).
                 ?downloadable reveals the .uf2 link + md5 (D-13). -->
            <div class="app-detail-meta">
              <span class="browser-entry-tag" x-text="'version ' + detailApp.version"></span>
              <template x-if="downloadable">
                <a class="btn-primary" :href="detailApp.binary" target="_blank" rel="noopener"><i class="fas fa-download"></i> Download .uf2</a>
              </template>
              <span class="browser-entry-path" x-show="downloadable" x-text="'md5: ' + detailApp.md5"></span>
            </div>
            <p class="app-detail-note" x-show="!downloadable">
              <i class="fas fa-circle-info"></i>
              Microfirmwares are installed from your SidecarTridge device — there's no download here.
            </p>
            <template x-if="detailApp.previous_versions && detailApp.previous_versions.length">
              <div class="app-detail-history">
                <h4>Version history</h4>
                <div class="browser-list">
                  <template x-for="pv in detailApp.previous_versions" :key="pv.version">
                    <article class="browser-entry-row">
                      <div class="browser-entry-row-main">
                        <div class="browser-entry-row-title"><h4 x-text="pv.version"></h4></div>
                        <p class="browser-entry-path" x-show="downloadable" x-text="'md5: ' + pv.md5"></p>
                      </div>
                      <div class="browser-entry-actions browser-entry-actions-rail" x-show="downloadable">
                        <a class="browser-download-button" :href="pv.binary" target="_blank" rel="noopener" aria-label="Download"><span class="fas fa-download"></span></a>
                      </div>
                    </article>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

  </main>

  <!-- Footer information in-page -->
  <footer class="footer">
    <p>&copy; 2025-26 GOODDATA LABS SLU. All rights reserved.</p>
  </footer>

</body>

</html>
