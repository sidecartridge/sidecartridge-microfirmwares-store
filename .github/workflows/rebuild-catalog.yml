name: Rebuild catalog

# Manually (or on a schedule) re-run the consolidation batch to pick up updated
# remote creator origins, commit any changed consolidated catalogs, and deploy.
# Kept independent of deploy.yml (which runs on push to main).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC

permissions:
  contents: write   # only the fallback push (GITHUB_TOKEN) if REBUILD_TOKEN is unset

concurrency:
  group: rebuild-catalog
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push as the REBUILD_TOKEN owner (a repo admin) so the rebuild's commit
          # bypasses the required 'validate' check (branch protection, enforce_admins:false)
          # and, being a PAT push, triggers deploy.yml. Falls back to GITHUB_TOKEN if the
          # secret is absent (works only while main is unprotected).
          token: ${{ secrets.REBUILD_TOKEN || github.token }}

      - name: Install validator
        # Pin the strict JSON Schema validator so the build always uses the
        # authoritative contract (schema/apps.schema.json), not the tool's lenient
        # structural fallback. Without this the result would depend on whether the
        # runner image happens to ship jsonschema.
        run: python3 -m pip install --quiet jsonschema

      - name: Validate origins
        run: python3 tools/build_catalog.py --check

      - name: Rebuild consolidated catalogs
        shell: bash
        run: |
          # pipefail so a fatal build (e.g. the stable channel) still fails the step
          set -o pipefail
          python3 tools/build_catalog.py | tee /tmp/build.log
          # A failing pre-release channel is non-fatal (its catalog is left unchanged) —
          # surface it as a job annotation so it can't rot silently. D-19.
          grep '^WARNING:' /tmp/build.log | sed 's/^/::warning::/' || true

      - name: Commit & deploy if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild consolidated catalogs (build_catalog.py)"
          # Pushing with REBUILD_TOKEN (a repo-admin PAT) bypasses the required
          # 'validate' check; a PAT push to main also triggers deploy.yml to publish.
          git push
