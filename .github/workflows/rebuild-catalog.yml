name: Rebuild catalog

# Manually (or on a schedule) re-run the consolidation batch to pick up updated
# remote creator origins, commit any changed consolidated catalogs, and deploy.
# Kept independent of deploy.yml (which runs on push to main).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC

permissions:
  contents: write   # commit regenerated catalogs
  actions: write    # dispatch the deploy workflow

concurrency:
  group: rebuild-catalog
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validator
        # Pin the strict JSON Schema validator so the build always uses the
        # authoritative contract (schema/apps.schema.json), not the tool's lenient
        # structural fallback. Without this the result would depend on whether the
        # runner image happens to ship jsonschema.
        run: python3 -m pip install --quiet jsonschema

      - name: Validate origins
        run: python3 tools/build_catalog.py --check

      - name: Rebuild consolidated catalogs
        run: python3 tools/build_catalog.py

      - name: Commit & deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild consolidated catalogs (build_catalog.py)"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
          # dispatch the Pages deploy explicitly to publish the new catalogs.
          gh workflow run "Deploy to GitHub Pages" --ref main
